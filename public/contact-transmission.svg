<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">A message taking flight</title>
  <desc id="desc">A hand-printed retro illustration of an idea-filled letter, a paper plane, and a winding red signal path.</desc>
  <defs>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r=".7" fill="#141414" fill-opacity=".1"/>
      <circle cx="13" cy="12" r=".55" fill="#E5262C" fill-opacity=".16"/>
    </pattern>
    <filter id="shadow" x="140" y="105" width="640" height="530" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <linearGradient id="paper" x1="300" x2="638" y1="146" y2="567" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFEFA"/><stop offset="1" stop-color="#E9E4DB"/>
    </linearGradient>
  </defs>
  <ellipse cx="462" cy="359" rx="372" ry="282" fill="url(#grain)"/>
  <ellipse cx="459" cy="357" rx="363" ry="274" stroke="#141414" stroke-opacity=".2" stroke-dasharray="2 9"/>
  <ellipse cx="459" cy="357" rx="315" ry="233" stroke="#E5262C" stroke-opacity=".36" stroke-dasharray="1 12"/>
  <path d="M105 389c109-107 190 120 319 3 92-84 158-80 239-1 41 40 77 44 132-2" stroke="#E5262C" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10"/>
  <circle cx="106" cy="389" r="8" fill="#E5262C"/><circle cx="795" cy="389" r="8" fill="#E5262C"/>
  <ellipse cx="469" cy="573" rx="234" ry="37" fill="#141414" fill-opacity=".24" filter="url(#shadow)"/>
  <g transform="rotate(-7 448 347)">
    <rect x="257" y="119" width="384" height="466" rx="5" fill="url(#paper)" stroke="#141414" stroke-width="7"/>
    <path d="M257 183h384" stroke="#141414" stroke-opacity=".2" stroke-width="2"/>
    <text x="287" y="161" fill="#141414" font-family="Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="4">A NOTE FROM VIVAN</text>
    <text x="294" y="248" fill="#E5262C" font-family="Georgia,serif" font-size="57" font-style="italic">Have an</text>
    <text x="294" y="306" fill="#141414" font-family="Arial,sans-serif" font-size="57" font-weight="800" letter-spacing="-4">IDEA?</text>
    <path d="M294 344h263" stroke="#141414" stroke-opacity=".2" stroke-width="2"/>
    <path d="M294 380h214m-214 24h249m-249 24h176" stroke="#141414" stroke-opacity=".43" stroke-width="5" stroke-linecap="round"/>
    <path d="M294 472h126" stroke="#E5262C" stroke-width="4" stroke-linecap="round"/>
    <text x="294" y="513" fill="#141414" font-family="Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="3">LET'S MAKE IT REAL</text>
    <g transform="rotate(8 566 489)">
      <rect x="513" y="451" width="86" height="86" fill="#E5262C"/>
      <circle cx="556" cy="494" r="30" stroke="#F6F4F0" stroke-width="1.5" stroke-dasharray="2 5"/>
      <text x="556" y="500" fill="#F6F4F0" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-style="italic">V / 01</text>
    </g>
