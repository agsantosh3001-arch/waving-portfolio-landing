  <path d="M173 220c24-24 24-58 0-82m-22 60c11-14 11-31 0-44m573 299c20 20 20 48 0 68m-20-51c9 10 9 23 0 33" stroke="#E5262C" stroke-width="4" stroke-linecap="round"/>
  <text x="101" y="607" fill="#141414" fill-opacity=".62" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="4">OPEN A LINE / SEND A SPARK</text>
  <text x="676" y="624" fill="#141414" fill-opacity=".62" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="3">POSTED WITH INTENT</text>
